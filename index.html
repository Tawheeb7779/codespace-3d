<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSpace 3D - Production Web IDE</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Material Design Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Tailwind Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-lowest": "#090e18",
                        "on-error-container": "#ffdad6",
                        "on-surface-variant": "#c2c6d6",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-bright": "#343944",
                        "error-container": "#93000a",
                        "inverse-surface": "#dee2f1",
                        "secondary-container": "#0267b8",
                        "on-secondary-container": "#d6e5ff",
                        "background": "#0e131d",
                        "primary-fixed": "#d8e2ff",
                        "inverse-primary": "#005ac2",
                        "inverse-on-surface": "#2b303b",
                        "outline-variant": "#424754",
                        "on-tertiary-fixed": "#311400",
                        "tertiary-container": "#df7412",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#303540",
                        "on-surface": "#dee2f1",
                        "primary-container": "#4d8eff",
                        "surface-dim": "#0e131d",
                        "secondary": "#a4c9ff",
                        "surface-tint": "#adc6ff",
                        "secondary-fixed-dim": "#a4c9ff",
                        "primary": "#adc6ff",
                        "secondary-fixed": "#d4e3ff",
                        "surface-container-low": "#171c26",
                        "on-secondary-fixed-variant": "#004883",
                        "tertiary-fixed": "#ffdcc6",
                        "on-tertiary": "#502400",
                        "on-tertiary-container": "#461f00",
                        "on-primary-container": "#00285d",
                        "surface-container-high": "#252a35",
                        "tertiary-fixed-dim": "#ffb786",
                        "on-background": "#dee2f1",
                        "on-tertiary-fixed-variant": "#723600",
                        "on-primary-fixed-variant": "#004395",
                        "on-error": "#690005",
                        "tertiary": "#ffb786",
                        "outline": "#8c909f",
                        "on-primary-fixed": "#001a42",
                        "on-secondary-fixed": "#001c39",
                        "on-secondary": "#00315d",
                        "surface": "#0e131d",
                        "surface-variant": "#303540",
                        "surface-container": "#1b202a",
                        "on-primary": "#002e6a"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        gutter: "20px",
                        unit: "4px",
                        xs: "4px",
                        "container-max": "1440px",
                        md: "16px",
                        sm: "8px",
                        lg: "24px",
                        xl: "40px"
                    },
                    fontFamily: {
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "code-sm": ["JetBrains Mono"],
                        "display-lg": ["Inter"]
                    },
                    fontSize: {
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "code-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }]
                    }
                }
            }
        };
    </script>
    
    <!-- Global Styles -->
    <style>
        body {
            background-color: #05070D;
            color: #dee2f1;
        }
        
        .glass-panel {
            background-color: #090D16;
            border: 1px solid rgba(140, 144, 159, 0.08);
        }
        
        .glass-elevated {
            background-color: #111827;
            border: 1px solid rgba(140, 144, 159, 0.12);
            backdrop-filter: blur(12px);
        }
        
        .glow-active:hover {
            box-shadow: 0 0 8px 0px rgba(173, 198, 255, 0.4);
            border-color: rgba(173, 198, 255, 0.3);
        }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Hide scrollbar while keeping functionality */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Focus states for accessibility */
        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 2px solid #adc6ff;
            outline-offset: 2px;
        }
        
        /* Smooth transitions */
        * {
            transition-duration: 150ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Prevent transition on certain properties */
        * {
            transition-property: background-color, border-color, color, fill, stroke;
        }
    </style>
</head>
<body class="font-body-md text-body-md bg-background text-on-background min-h-screen flex flex-col">
    
    <!-- App Container -->
    <div id="app" class="flex flex-col min-h-screen">
        <!-- Top App Bar -->
        <header id="header" class="fixed top-0 w-full h-14 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/10 flex justify-between items-center px-lg z-50 transition-all duration-200 ease-in-out">
            <div class="flex items-center gap-lg">
                <span class="font-headline-md text-headline-md font-bold tracking-tighter text-on-surface">CodeSpace 3D</span>
                <nav id="main-nav" class="hidden md:flex gap-md">
                    <!-- Navigation populated by router -->
                </nav>
            </div>
            <div id="header-actions" class="flex items-center gap-sm">
                <!-- Header actions populated by router -->
            </div>
        </header>
        
        <!-- Main Content Area -->
        <div class="flex flex-1 mt-14">
            <!-- Sidebar -->
            <aside id="sidebar" class="fixed left-0 top-14 bottom-0 w-16 md:w-20 bg-surface-container-low border-r border-outline-variant/10 flex flex-col items-center py-md z-40 transition-all duration-200 ease-in-out">
                <!-- Sidebar content populated by router -->
            </aside>
            
            <!-- View Container -->
            <main id="view-container" class="flex-1 ml-16 md:ml-20 mb-6 p-lg xl:p-xl overflow-y-auto">
                <!-- Current view rendered here -->
            </main>
        </div>
        
        <!-- Footer -->
        <footer id="footer" class="fixed bottom-0 w-full h-6 bg-surface-container-lowest border-t border-outline-variant/10 flex justify-between items-center px-md z-50 overflow-hidden font-code-sm text-code-sm text-outline">
            <div>© 2024 CodeSpace 3D | System: Ready</div>
            <div class="flex gap-md">
                <a class="hover:text-primary transition-colors cursor-pointer">Logs</a>
                <a class="hover:text-primary transition-colors cursor-pointer">Status</a>
                <a class="hover:text-primary transition-colors cursor-pointer">UTF-8</a>
            </div>
        </footer>
    </div>
    
    <!-- Application JavaScript -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
